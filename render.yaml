# Render.com Blueprint: runs Quote to Paid as a public demo website.
# In Render: New → Blueprint → pick this repo. Every push to main redeploys.
#
# The free plan sleeps after 15 minutes without visitors (the first visit after
# that takes about a minute) and its disk is wiped on each restart or deploy.
# That's fine for the demo: the app re-creates the demo business on start-up.
services:
  - type: web
    name: quote-to-paid
    runtime: node
    plan: free
    region: frankfurt # closest Render region to the UK
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/business/public
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEMO_MODE
        value: "1"
      - key: DEMO_RESET_HOURS
        value: "6"
      - key: TRUST_PROXY
        value: "1"
      # Most real AI quotes per day, as a spending backstop.
      - key: AI_DAILY_LIMIT
        value: "50"
      - key: SESSION_SECRET
        generateValue: true
      # Private passwords (12+ characters). Render asks for these when you create the
      # Blueprint. They replace the demo passwords in the code (which is public) and
      # hide the demo logins from the login page.
      - key: OWNER_PASSWORD
        sync: false
      - key: AGENCY_PASSWORD
        sync: false
      # Turns on the real AI quote builder. The site refuses to start with a key
      # unless both passwords above are set. Set a monthly spend limit in the
      # Anthropic Console too.
      - key: ANTHROPIC_API_KEY
        sync: false
